---
wireguard_dep_packages:
  - wireguard
wireguard_config_dir: "/etc/wireguard"
wireguard_save_public_keys: true
wireguard_hostdatadir_path: "host_data"
wireguard_tunnels:
  # wg0:
  #   Address: 192.168.0.1/24
  #   ListenPort: 51820
  #   enabled: false
  #   state: started
  #   Peers:
  #     - AllowedIPs:
  #         - 192.168.0.2/24
  #       PublicKey: KEYHERE
wireguard_print_peer_configuration: true
wireguard_no_log: true
wireguard_configure_dns: false
wireguard_host_tunnel: wg0
wireguard_dns_upstream: 9.9.9.9 149.112.112.112
wireguard_fqdn: "{{ ( '//' + wireguard_tunnels[wireguard_host_tunnel].Endpoint ) | urlsplit('hostname') }}"
wireguard_dns_redirects:
  - "{{ wireguard_tunnels[wireguard_host_tunnel].Address | ansible.utils.ipaddr('address') }} {{ wireguard_fqdn }}"
...
